<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Register - PTP Group</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <header class="navbar">
        <h1>Registrate aqui</h1>
        
        <nav class="nav-buttons">
            <button class="button-styleI" id="registerButton" onclick="location.href='index.html'">
            <i class="bi bi-arrow-left"></i> Volver</button>
        </nav>
    </header>


    <div style="text-align:center;">
    <form id=registroFrm>
        <label>Nombre
            <input id="nombre" placeholder="Ingresa tu nombre" type="text" required>
        </label>
        <br>
        <label>Correo electronico
            <input id="email" placeholder="Ej: example@gmail.com" type="email" required>
        </label>
        <br>
        <label>Telefono
            <input id="telefono" placeholder="Ingresa tu numero de telefono" type="tel" required>
        </label>
        <br>
        <label>Password
            <input id="password" placeholder="Ingresa tu password" type="password" required>
        </label>
        <br>
        <label>Confirmar password
            <input id="password2" placeholder="Ingresar tu password devuelta" type="password" required>
        </label>
        <br>
        <label>
            <input type="radio" name="estado_academico" value="estudiante" onclick="mostrarCampos()">
            Estudiante
        </label>

        <label>
            <input type="radio" name="estado_academico" value="egresado">
            Egresado
        </label>
        <br>

        <label>
            <input type="checkbox" id="terminos" required>
            Acepto los términos y condiciones
        </label>
        <br>
        <button id="registrarseBtn" type="button" onClick="agregarUsuario()" class="button-style">Registrarse</button>

    </div>
</body>
<script src="js/scriptUsuario.js"></script>

<footer class="footer">
    <p>© 2026 PTP Group. Todos los derechos reservados.</p>
</footer>

</html>
