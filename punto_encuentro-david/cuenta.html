<!DOCTYPE html>
<html  src="style.css" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <button onclick="location.href='index.html'"><-</button>
    <title>Mi cuenta</title>
</head>

<body>

    <header>
        <h1>Mi cuenta</h1>
    </header>

    <main>

        <section>
            <h2>Datos del usuario</h2><button id="editarBtn" onclick="editarCuenta()">Editar cuenta</button>

            <div>
                <p>
                    <strong>Nombre:</strong>
                    <span id="nombreUsuario"></span>
                </p>

                <p>
                    <strong>Correo electrónico:</strong>
                    <span id="emailUsuario"></span>
                </p>

                <p>
                    <strong>Teléfono:</strong>
                    <span id="telefonoUsuario"></span>
                </p>

                <p>
                    <strong>Estado academico:</strong>
                    <span id="estadoAcademico"></span>
                </p>
            </div>
        </section>

        <section>
            <h2>Mi currículum</h2>

            <a>"Tus datos y CV serán utilizados exclusivamente para los procesos de selección de la empresa."</a>

            <div id="cv">

            <p>Sube tu currículum para completar tu perfil.</p>

                <label for="curriculum">Seleccionar currículum:</label>

                <input type="file" id="curriculum" name="curriculum" accept=".pdf,.doc,.docx">

                <button type="submit">Subir currículum</button>

            </div>
        </section>

        <button id="borrarBtn" onclick="confirmarEliminacion()">Eliminar cuenta</button>

    </main>

</body>
</html>

<script src="js/scriptUsuario.js"></script>
<script>
    const datos = JSON.parse(localStorage.getItem("usuario"));

    if (!datos) {
        window.location.href = "index.html";
        alert("Debes iniciar sesión para acceder a esta página");
    }
</script>
