<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTP Group</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <h1>Cuenta</h1>
        
        <nav class="nav-buttons">
            <button class="button-styleI" onclick="location.href='index.html'">&larr; Volver</button>
        </nav>
        
        <a id="cuenta"></a>
    </header>

    <main>
        <section>
            <h2>Datos del usuario</h2>
            <nav class="nav-buttons">
                <button class="button-style" id="editarBtn" onclick="editarCuenta()">Editar cuenta</button>
            </nav>
            <div>
                <p>
                    <strong>Nombre:</strong>
                    <span id="nombreUsuario"></span>
                </p>
                <p>
                    <strong>Correo electrónico:</strong>
                    <span id="emailUsuario"></span>
                </p>
                <p>
                    <strong>Teléfono:</strong>
                    <span id="telefonoUsuario"></span>
                </p>
                <p>
                    <strong>Estado académico:</strong>
                    <span id="estadoAcademico"></span>
                </p>
            </div>
        </section>

        <section>
            <h2>Mi currículum</h2>
            <p>"Tus datos y CV serán utilizados exclusivamente para los procesos de selección de la empresa."</p>

            <div id="cv">
                <p>Sube tu currículum para completar tu perfil.</p>
                <label for="curriculum">Seleccionar currículum:</label>
                <input type="file" id="curriculum" name="curriculum" accept=".pdf,.doc,.docx">
                <button type="button" class="button-style">Subir currículum</button>
            </div>
        </section>

        <button id="borrarBtn" onclick="confirmarEliminacion()" class="button-styleR">Eliminar cuenta</button>
    </main>

    <script src="js/scriptUsuario.js"></script>
    <script>
        const usuarioJSON = localStorage.getItem("usuario");

        if (!usuarioJSON) {
            alert("Debes iniciar sesión para acceder a esta página");
            window.location.href = "index.html";
        } else {
            const datos = JSON.parse(usuarioJSON);
        }
    </script>
</body>

<footer class="footer">
    <p>© 2026 PTP Group. Todos los derechos reservados.</p>
</footer>

</html>
