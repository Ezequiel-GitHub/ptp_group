<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PTP Group</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <header class="navbar">
        <h1>PTP Group</h1>
        
        <nav class="nav-buttons">
            <button class="button-style" id="registerButton" onclick="location.href='register.html'">
            <i class="bi-person-plus-fill"></i> Registrate</button>
            <button class="button-style" id="loginButton" onclick="location.href='login.html'">
            <i class="bi bi-key-fill"></i> Login</button>
            <button class="button-style" id="ofertasButton" style="display: none;" onclick="location.href='oferta.html'">
            <i class="bi-briefcase-fill"></i> Ofertas</button>
            <button class="button-style" id="postulacionesButton" style="display: none;" onclick="location.href='postulaciones.html'">
            <i class="bi-file-earmark-text-fill"></i> Postulaciones</button>
            <button class="button-style" id="perfilButton" style="display: none;" onclick="location.href='cuenta.html'">
            <i class="bi bi-person-fill"></i> Mi Perfil</button>
            <button class="button-styleR" id="logoutButton" style="display: none;" onclick="cerrarSesion()">
            <i class="bi-box-arrow-in-right"></i> Cerrar Sesión</button>
        </nav>

        <a id="cuenta"></a>
    </header>

    <main>
        <form id="busquedaForm">
            <input id="titulo" type="text" placeholder="Buscar oferta...">
            <button type="button" onclick="mostrarOferta()" class="button-style">Buscar</button>
        </form>
        <div id="ofertas" class="ofertas">
            <!-- Aquí se mostrarán las ofertas -->
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/scriptOferta.js"></script>
    <script src="js/scriptUsuario.js"></script>
    <script src="js/scriptPostulacion.js"></script>
    
    <script>
        const titulo = document.getElementById("titulo");

        titulo.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                mostrarOferta();
            }
        });

        verificarSesion();
    </script>

<footer class="footer">
    <p>© 2026 PTP Group. Todos los derechos reservados.</p>
</footer>

</body>

</html>
