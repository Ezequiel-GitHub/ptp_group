<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto Encuentro</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <h1>Punto Encuentro</h1>
        
        <nav class="nav-buttons">
            <button class="button-style" id="registerButton" onclick="location.href='register.html'">Registrate</button>
            <button class="button-style" id="loginButton" onclick="location.href='login.html'">Login</button>
            <button class="button-style" id="ofertasButton" style="display: none;" onclick="location.href='oferta.html'">Ofertas</button>
            <button class="button-style" id="postulacionesButton" style="display: none;" onclick="location.href='postulaciones.html'">Postulaciones</button>
            <button class="button-style" id="perfilButton" style="display: none;" onclick="location.href='cuenta.html'">Mi Perfil</button>
            <button class="button-style" id="logoutButton" style="display: none;" onclick="cerrarSesion()">Cerrar Sesión</button>
        </nav>
        
        <a id="cuenta"></a>
    </header>

    <main>
        <form id="busquedaForm">
            <input id="titulo" type="text" placeholder="Buscar oferta...">
            <button type="button" onclick="mostrarOferta()">Buscar</button>
        </form>
        <div id="ofertas" class="ofertas">
            <!-- Aquí se mostrarán las ofertas -->
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/scriptOferta.js"></script>
    <script src="js/scriptUsuario.js"></script>
    <script src="js/scriptPostulacion.js"></script>
    
    <script>
        const titulo = document.getElementById("titulo");

        titulo.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                mostrarOferta();
            }
        });

        verificarSesion();
    </script>



<footer class="footer">
    <p>© 2026 Punto Encuentro. Todos los derechos reservados.</p>
</footer>



</body>

</html>
