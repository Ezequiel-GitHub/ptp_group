<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - PTP Group</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <header class="navbar">
        <h1>Iniciar Sesión</h1>
        
        <nav class="nav-buttons">
            <button class="button-styleI" id="registerButton" onclick="location.href='index.html'">
            <i class="bi bi-arrow-left"></i> Volver</button>
        </nav>
    </header>



    <div style="text-align:center;">
        <form id="loginFrm">
            <label>Email
                <input id="email" type="email" placeholder="Ingresa tu correo" required>
            </label>
            <br><br>
            <label>Password
                <input id="password" type="password" placeholder="Ingresa tu password" required>
            </label>
            <br><br>
            <button type="button" onclick="login()" class="button-style">Entrar</button>
        </form>
        <br>
        <a>¿Aún no tienes una cuenta?</a>
        <br>
        <button type="button" onclick="window.location.href = 'register.html'" class="button-style">Registrate</button>
        <div id="mensaje" style="margin-top:20px"></div>
    </div>

<script src="js/scriptUsuario.js"></script>
</body>

<footer class="footer">
    <p>© 2026 PTP Group. Todos los derechos reservados.</p>
</footer>

</html>
