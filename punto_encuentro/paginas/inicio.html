<main>
    <form id="busquedaForm">
        <input id="titulo" type="text" placeholder="Buscar oferta...">
        <button type="button" onclick="mostrarOferta()" class="button-style">Buscar</button>
    </form>
    <div id="ofertas" class="ofertas">
        <!-- Aquí se mostrarán las ofertas -->
    </div>
</main>

<script>
        const titulo = document.getElementById("titulo");

        titulo.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                mostrarOferta();
            }
        });

        verificarSesion();
</script>
